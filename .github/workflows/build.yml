name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Unzip
        run: unzip -o ats.zip

      - name: Fix
        run: |
          echo "include ':app'" > settings.gradle
          cat > build.gradle <<'EOF'
          buildscript {
              repositories { google(); mavenCentral(); maven { url "https://jcenter.bintray.com" } }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.4' }
          }
          allprojects {
              repositories { google(); mavenCentral(); maven { url "https://jcenter.bintray.com" }; maven { url "https://jitpack.io" } }
          }
          EOF
          sed -i '/ListenableFuture/d' app/build.gradle
          sed -i '/com.google.common.util.concurrent/d' app/build.gradle
          sed -i "/dependencies {/a implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'" app/build.gradle

          # --- Crea los archivos que faltan en tu zip ---
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/mipmap
          mkdir -p app/src/main/res/drawable

          cat > app/src/main/res/xml/data_extraction_rules.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?><data-extraction-rules><cloud-backup/><device-transfer/></data-extraction-rules>
          XML
          cat > app/src/main/res/xml/backup_rules.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?><full-backup-content></full-backup-content>
          XML

          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+ip1sAAAAASUVORK5CYII=" | base64 -d > app/src/main/res/mipmap/ic_launcher.png
          cp app/src/main/res/mipmap/ic_launcher.png app/src/main/res/mipmap/ic_launcher_round.png

          # Crea todos los drawables que faltan como placeholders
          for name in bg_meter_progress ic_music_note ic_arrow_back bg_chip_dsp ic_album_art_placeholder ic_shuffle ic_skip_previous ic_play_arrow bg_circle_button ic_skip_next ic_repeat ic_volume_down ic_volume_up ic_equalizer ic_play bg_meter_bg bg_chip selected_background; do
            cat > app/src/main/res/drawable/$name.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#FF6200EE"/></shape>
          XML
          done

          ls -R app/src/main/res/drawable | head -n 100

      - name: Build
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: APK-ATS
          path: app/build/outputs/apk/debug/*.apk
