name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Unzip
        run: unzip -o ats.zip
      - name: Fix
        run: |
          rm -rf app/src/main/java/com/ats/audioplayer/*
          mkdir -p app/src/main/java/com/ats/audioplayer app/src/main/res/xml app/src/main/res/mipmap
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          include ':app'
          EOF
          echo "// empty root" > build.gradle
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.1.4' }
          android { namespace 'com.ats.audioplayer'; compileSdk 34; defaultConfig { applicationId "com.ats.audioplayer"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }; compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 } }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'com.google.android.exoplayer:exoplayer:2.19.1'; }
          EOF
          mkdir -p app/src/main/res/xml
          echo '<?xml version="1.0" encoding="utf-8"?><data-extraction-rules><cloud-backup/><device-transfer/></data-extraction-rules>' > app/src/main/res/xml/data_extraction_rules.xml
          echo '<?xml version="1.0" encoding="utf-8"?><full-backup-content></full-backup-content>' > app/src/main/res/xml/backup_rules.xml
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+ip1sAAAAASUVORK5CYII=" | base64 -d > app/src/main/res/mipmap/ic_launcher.png
          cp app/src/main/res/mipmap/ic_launcher.png app/src/main/res/mipmap/ic_launcher_round.png
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <application android:icon="@mipmap/ic_launcher" android:label="ATS SpotiFLAC" android:theme="@android:style/Theme.NoTitleBar">
                  <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/ats/audioplayer/MainActivity.java <<'EOF'
          package com.ats.audioplayer;
          import android.Manifest; import android.content.pm.PackageManager; import android.os.Bundle; import android.os.Environment; import android.widget.*; import androidx.appcompat.app.AppCompatActivity; import androidx.core.app.ActivityCompat; import com.google.android.exoplayer2.ExoPlayer; import com.google.android.exoplayer2.MediaItem; import java.io.File; import java.util.ArrayList;
          public class MainActivity extends AppCompatActivity {
              ExoPlayer player; ArrayList<File> flacs = new ArrayList<>();
              @Override protected void onCreate(Bundle b){ super.onCreate(b);
                  LinearLayout root = new LinearLayout(this); root.setOrientation(LinearLayout.VERTICAL);
                  TextView title = new TextView(this); title.setPadding(20,20,20,20); title.setTextSize(18);
                  ListView list = new ListView(this);
                  LinearLayout controls = new LinearLayout(this); controls.setOrientation(LinearLayout.HORIZONTAL);
                  Button prev = new Button(this); prev.setText("<<"); Button play = new Button(this); play.setText("Play/Pause"); Button next = new Button(this); next.setText(">>");
                  controls.addView(prev); controls.addView(play); controls.addView(next);
                  root.addView(title); root.addView(controls); root.addView(list); setContentView(root);
                  if (ActivityCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_AUDIO)!= PackageManager.PERMISSION_GRANTED){ ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.READ_MEDIA_AUDIO, Manifest.permission.READ_EXTERNAL_STORAGE}, 1); }
                  player = new ExoPlayer.Builder(this).build();
                  File base = new File(Environment.getExternalStorageDirectory(), "Music/SpotiFLAC"); scan(base);
                  if(flacs.isEmpty()) scan(new File(Environment.getExternalStorageDirectory(), "Music"));
                  ArrayList<String> names = new ArrayList<>(); for(File f: flacs) names.add(f.getName() + " (" + (f.length()/1024/1024) + " MB)");
                  title.setText("SpotiFLAC: " + flacs.size() + " temas");
                  ArrayAdapter<String> adapter = new ArrayAdapter<>(this, android.R.layout.simple_list_item_1, names); list.setAdapter(adapter);
                  list.setOnItemClickListener((p,v,pos,id)->{ player.setMediaItem(MediaItem.fromUri(flacs.get(pos).getAbsolutePath())); player.prepare(); player.play(); Toast.makeText(this, "Reproduciendo: "+flacs.get(pos).getName(), Toast.LENGTH_SHORT).show(); });
                  play.setOnClickListener(v->{ if(player.isPlaying()) player.pause(); else player.play(); });
              }
              void scan(File dir){ if(dir==null||!dir.exists()) return; File[] fs = dir.listFiles(); if(fs==null) return; for(File f: fs){ if(f.isDirectory()){ if(!f.getName().startsWith(".")) scan(f);} else { String n=f.getName().toLowerCase(); if(n.endsWith(".flac")||n.endsWith(".mp3")||n.endsWith(".wav")||n.endsWith(".m4a")) flacs.add(f);} } }
              @Override protected void onDestroy(){ super.onDestroy(); if(player!=null) player.release(); }
          }
          EOF

      - name: Build
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: APK-SpotiFLAC-OK, path: app/build/outputs/apk/debug/*.apk }
