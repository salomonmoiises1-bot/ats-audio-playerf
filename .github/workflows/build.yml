name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Unzip
        run: |
          unzip -o ats.zip
          ls -la

      - name: Fix
        run: |
          echo "include ':app'" > settings.gradle
          cat > build.gradle <<'EOF'
          buildscript {
              repositories { google(); mavenCentral(); maven { url "https://jcenter.bintray.com" } }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.4' }
          }
          allprojects {
              repositories { google(); mavenCentral(); maven { url "https://jcenter.bintray.com" }; maven { url "https://jitpack.io" } }
          }
          EOF
          sed -i '/ListenableFuture/d' app/build.gradle
          sed -i '/com.google.common.util.concurrent/d' app/build.gradle
          sed -i "/dependencies {/a implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'" app/build.gradle

      - name: Build
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: APK-ATS
          path: app/build/outputs/apk/debug/*.apk
